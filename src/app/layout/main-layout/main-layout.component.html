<div
  class="shell"
  [class.sidebar-resizing]="isSidebarResizing"
  [class.sidebar-collapsed]="sidebarCollapsed">

  <!-- OVERLAY PARA MÓVIL -->
  <div
    class="mobile-overlay"
    *ngIf="isMobile && mobileMenuOpen"
    (click)="closeMobileMenu()">
  </div>

  <!-- SIDENAV -->
  <aside
    class="sidenav"
    [class.mobile-open]="mobileMenuOpen"
    [style.width.px]="sidebarCollapsed && !isMobile ? 76 : sidebarWidth">

    <!-- BRAND -->
    <div class="brand">
      <mat-icon>storefront</mat-icon>
      <div class="brand-text">
        <span class="title">CarsugForce</span>
        <span class="subtitle" > {{ sucursal }}</span>
      </div>
      <button
        mat-icon-button
        class="sidebar-hide-btn"
        type="button"
        *ngIf="!isMobile"
        (click)="toggleSidebar()"
        [attr.aria-label]="sidebarCollapsed ? 'Mostrar menu lateral' : 'Ocultar menu lateral'">
        <mat-icon>{{ sidebarCollapsed ? 'keyboard_double_arrow_right' : 'keyboard_double_arrow_left' }}</mat-icon>
      </button>
    </div>

    <!-- MENU -->
    <mat-nav-list>
      <ng-container *ngFor="let item of menuItems">

        <!-- ITEM SIMPLE -->
        <a *ngIf="!item.children"
           mat-list-item
           [routerLink]="item.route"
           routerLinkActive="active"
           [attr.data-tooltip]="sidebarCollapsed && !isMobile ? item.label : null"
           (click)="isMobile ? closeMobileMenu() : null">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>

        <!-- ITEM CON SUBMENÚ -->
        <div *ngIf="item.children" class="menu-group">

          <div class="menu-group-header"
               [attr.data-tooltip]="sidebarCollapsed && !isMobile ? item.label : null"
               [class.active]="isChildActive(item)"
               (click)="sidebarCollapsed && !isMobile ? null : item.open = !item.open">

            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
            <mat-icon class="arrow" [class.open]="item.open">expand_more</mat-icon>

          </div>

          <div class="submenu" [class.open]="item.open">
            <a mat-list-item
               *ngFor="let c of item.children"
               [routerLink]="c.route"
               routerLinkActive="active"
               (click)="isMobile ? closeMobileMenu() : null">
              <mat-icon matListItemIcon>{{ c.icon }}</mat-icon>
              <span matListItemTitle>{{ c.label }}</span>
            </a>
          </div>

        </div>

      </ng-container>
    </mat-nav-list>

    <!-- FOOTER -->
    <div class="sidenav-footer">
      <div class="profile">

        <div class="profile-avatar-wrapper"
         (click)="openUserModal()"
          (keydown.enter)="openUserModal()"
          tabindex="0"
          role="button"
          aria-label="Abrir perfil">
          <img class="avatar"
               [src]="'https://api.dicebear.com/7.x/initials/png?seed=' + userName"
               alt="avatar" />
          <div class="edit-icon">
            <mat-icon>edit</mat-icon>
          </div>
        </div>

        <div class="profile-info">
          <span class="name">{{ userName }}</span>
          <span class="role">{{ currentRole }}</span>
        </div>

        <button mat-icon-button class="logout-btn" (click)="logout()">
          <mat-icon>logout</mat-icon>
        </button>

      </div>
    </div>

    <div
      class="sidenav-resize-handle"
      *ngIf="!isMobile"
      role="separator"
      aria-orientation="vertical"
      aria-label="Redimensionar menu lateral"
      (mousedown)="startSidebarResize($event)">
    </div>

  </aside>

  <!-- CONTENT -->
  <section class="content">

    <!-- TOOLBAR -->
    <mat-toolbar class="toolbar">

      <!-- HAMBURGER SOLO EN MÓVIL -->
      <button
        mat-icon-button
        class="hamburger"
        *ngIf="isMobile"
        (click)="openMobileMenu()">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="page-title">{{ pageTitle }}</span>

      <span class="spacer"></span>

     <button mat-icon-button class="theme-toggle" (click)="toggleTheme(!isDarkMode)">
      <mat-icon class="icon-normal">{{ isDarkMode ? 'dark_mode' : 'light_mode' }}</mat-icon>
      <mat-icon class="icon-hover">{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>


    </mat-toolbar>

    <main class="page">
      <router-outlet></router-outlet>
    </main>

  </section>

</div>
